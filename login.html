<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Self-hosted React (E4.4, 2026-08-31). support.js loads React and ReactDOM
   from unpkg.com; unpkg being down or blocked made every board a white page,
   with no fallback and nothing in the app's control.

   support.js is GENERATED and must not be hand-edited, and dc-runtime/ is not
   in this repo -- but it does not need editing. Its cdnScriptFor() checks
   window.__resources[url] first and uses that value when it is a non-empty
   string, so this map redirects both files to ./vendor/ copies with no change
   to the generated file. Must run BEFORE support.js below.

   The vendor files are byte-identical to what unpkg served: both were verified
   against the SRI hashes support.js already pins. Note the override path drops
   the integrity attribute (cdnScriptFor returns {src} only) -- acceptable
   because these are now same-origin and travel under the same TLS and
   Cloudflare Access boundary as the page itself.

   Babel is deliberately NOT self-hosted: support.js only fetches it for
   `jsx` script blocks and no page has one (every block is type="text/x-dc"),
   so it is never requested. Add it here if a JSX page is ever introduced. */
window.__resources = Object.assign({}, window.__resources, {
  "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react-18.3.1.production.min.js",
  "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom-18.3.1.production.min.js"
});
</script>
<link rel="stylesheet" href="./tokens.css">
<script src="./support.js"></script>
<script src="./ca-api.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
  <style>
    input{font-family:inherit}
    input::placeholder{color:var(--text-faint)}
    @keyframes ca-fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%,#141417,#08080A 60%)">

  <sc-if value="{{screenPin}}" hint-placeholder-val="{{ true }}">
    <div style="width:100%;max-width:400px;animation:ca-fade .25s ease">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:30px">
        <svg width="60" height="60" viewBox="0 0 48 48" aria-hidden="true"><g fill="#C6372B"><rect x="12" y="9" width="24" height="3.1" rx="1.5"/><rect x="8" y="14" width="32" height="3.1" rx="1.5"/><rect x="5" y="19" width="38" height="3.1" rx="1.5"/><rect x="5" y="24" width="38" height="3.1" rx="1.5"/><rect x="6" y="29" width="36" height="3.1" rx="1.5"/><rect x="9" y="34" width="30" height="3.1" rx="1.5"/><rect x="13" y="39" width="22" height="3.1" rx="1.5"/></g></svg>
        <div style="text-align:center">
          <div style="font:700 22px/1 'Oswald';letter-spacing:.12em;color:#ECEAE4">CULTURE APPAREL</div>
          <div style="font:500 10px/1 'Oswald';letter-spacing:.36em;text-transform:uppercase;color:#C6372B;margin-top:7px">Production Floor</div>
        </div>
      </div>
      <div style="background:#0D0D0F;border:1px solid #1f1f23;border-radius:18px;padding:30px 28px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)">
        <div style="font:500 12px/1.4 'Archivo';color:var(--text-tertiary);text-align:center;margin-bottom:22px">Enter your PIN to continue</div>
        <div style="display:flex;justify-content:center;gap:14px;margin-bottom:8px;animation:{{shakeAnim}}">
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
            <div style="width:15px;height:15px;border-radius:50%;border:2px solid {{d.border}};background:{{d.bg}};transition:all .12s"></div>
          </sc-for>
        </div>
        <div style="height:20px;text-align:center;font:600 11px/20px 'Oswald';letter-spacing:.06em;text-transform:uppercase;color:{{statusColor}};margin-bottom:14px">{{statusText}}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <sc-for list="{{pad}}" as="p" hint-placeholder-count="12">
            <button onClick="{{ p.onPress }}" style="background:{{p.bg}};border:1px solid {{p.border}};color:{{p.color}};font:600 24px/1 'Oswald';border-radius:12px;padding:20px 0;cursor:pointer;transition:transform .08s" style-active="transform:scale(.94)"><sc-if value="{{p.isIcon}}" hint-placeholder-val="{{ false }}"><i class="ti {{p.icon}}"></i></sc-if><sc-if value="{{p.isText}}" hint-placeholder-val="{{ true }}">{{p.label}}</sc-if></button>
          </sc-for>
        </div>
      </div>
      <div style="text-align:center;font:400 11px/1.5 'Archivo';color:var(--text-faint);margin-top:18px">Forgot your PIN? Ask a manager to look it up.</div>
    </div>
  </sc-if>

  <sc-if value="{{screenDone}}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;max-width:420px;animation:ca-fade .25s ease">
      <div style="background:#0D0D0F;border:1px solid #1f1f23;border-radius:18px;padding:32px 30px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)">
        <div style="display:flex;align-items:center;gap:13px;margin-bottom:24px">
          <span style="width:48px;height:48px;border-radius:50%;background:{{roleColor}};color:#08080A;font:700 15px/48px 'Oswald';text-align:center;flex-shrink:0">{{nameInit}}</span>
          <div style="min-width:0">
            <div style="font:600 19px/1 'Oswald';color:#ECEAE4">Welcome, {{name}}</div>
            <div style="display:inline-flex;align-items:center;gap:6px;font:600 9px/1 'Oswald';letter-spacing:.1em;text-transform:uppercase;color:{{roleColor}};background:{{roleBg}};border:1px solid {{roleBorder}};border-radius:6px;padding:5px 9px;margin-top:9px"><i class="ti {{roleIcon}}"></i>{{roleLabel}}</div>
          </div>
          <button onClick="{{ onLogout }}" style="margin-left:auto;flex-shrink:0;font:600 10px/1 'Oswald';letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary);background:transparent;border:1px solid #2a2a2f;border-radius:8px;padding:9px 11px;cursor:pointer" style-hover="border-color:#C6372B;color:#C6372B"><i class="ti ti-logout"></i></button>
        </div>
        <div style="font:600 10px/1 'Oswald';letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px">Open a board</div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <sc-for list="{{boards}}" as="b" hint-placeholder-count="3">
            <a href="{{b.href}}" style="display:flex;align-items:center;gap:13px;background:#141417;border:1px solid #232327;border-left:4px solid {{b.color}};border-radius:11px;padding:15px 16px" style-hover="border-color:#3a3a40;border-left-color:{{b.color}}">
              <i class="ti {{b.icon}}" style="color:{{b.color}};font-size:20px"></i>
              <div style="min-width:0"><div style="font:600 15px/1 'Oswald';color:#ECEAE4">{{b.label}}</div><div style="font:400 11px/1 'Archivo';color:var(--text-muted);margin-top:4px">{{b.sub}}</div></div>
              <i class="ti ti-arrow-right" style="margin-left:auto;color:var(--text-faint);font-size:17px"></i>
            </a>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#C6372B"/><text x="50" y="60" font-family="Oswald,Arial" font-size="30" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">CA</text><text x="50" y="78" font-family="Arial" font-size="9" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">LOGIN</text></svg></template></x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
// The only names the app will accept for shift attribution. Kept only as a
// sanity check on RESUME below (a stored name that's since been removed from
// the roster shouldn't silently keep working) -- login itself no longer
// walks this list; the PIN alone now tells the server who you are.
// Single source of truth is ca-api.js (window.CAApi). Literal fallback below
// only matters if ca-api.js somehow fails to load.
const VALID_NAMES = (window.CAApi && window.CAApi.VALID_NAMES) || ['Anthony','Asher','Alex','Parker','Titus','Gian','Isaac','Bronson','Zach','Logan','Avery','Jeff'];

class Component extends DCLogic {
  constructor(props){ super(props); this.state={ screen:'pin', pin:'', role:null, name:'', err:'', submitting:false, shake:false }; }
  // RESUME (2026-08-13): unchanged from before this page moved to real
  // per-worker PINs -- still just trusts whatever role/name localStorage
  // already has from a still-valid earlier login, same as every other board.
  // VALID_NAMES.includes(n) guards against resuming as someone who's been
  // removed from the roster since they last logged in.
  componentDidMount(){ this._kd=(e)=>this.onKey(e); window.addEventListener('keydown',this._kd); try{ const r=localStorage.getItem('caShopRole'), n=((window.CAApi&&window.CAApi.anyWorkerName)?window.CAApi.anyWorkerName():localStorage.getItem('caShopWorkerName')); if(r && n && VALID_NAMES.includes(n)){ this.setState({role:r,name:n,screen:'done'}); } }catch(_){} }
  componentWillUnmount(){ window.removeEventListener('keydown',this._kd); }
  onKey(e){ if(this.state.screen!=='pin' || this.state.submitting) return; if(/^[0-9]$/.test(e.key)) this.press(e.key); else if(e.key==='Backspace') this.backspace(); }
  press(d){ if(this.state.pin.length>=4 || this.state.submitting) return; const pin=this.state.pin+d; this.setState({pin,err:''}); if(pin.length===4) setTimeout(()=>this.submit(pin),140); }
  backspace(){ if(this.state.submitting) return; this.setState(st=>({pin:st.pin.slice(0,-1),err:''})); }
  // Verifies the PIN SERVER-SIDE (POST /api/worker-login -- see
  // functions/api/_worker-auth.js) instead of comparing against a shared
  // hardcoded value here. One PIN now identifies both who's typing and their
  // role in a single round trip -- there's no separate "pick your name"
  // step anymore because the PIN itself already answers that.
  async submit(pin){
    if(this.state.submitting) return;
    this.setState({submitting:true, err:''});
    try{
      const api=window.CAApi; if(!api || !api.workerLogin) throw new Error('CAApi not loaded');
      const res=await api.workerLogin(pin);
      if(!res || !res.name || !res.role) throw new Error('bad_response');
      // Writes BOTH worker-name keys plus the role (see setIdentity() in
      // ca-api.js): station.html and shipping.html read their own key, so
      // logging in here used to leave those two boards still asking for the
      // PIN that had just been entered. Falls back to the original direct
      // writes if ca-api.js hasn't loaded, so login never hard-depends on it.
      { const a=window.CAApi; if(a&&a.setIdentity) a.setIdentity(res.name,res.role); else { try{ localStorage.setItem('caShopRole',res.role); localStorage.setItem('caShopWorkerName',res.name); }catch(_){} } }
      this.setState({submitting:false, role:res.role, name:res.name, pin:'', screen:'done'});
    }catch(e){
      const msg = (e && e.status===401) ? 'Incorrect PIN — try again'
        : (e && e.status===500) ? "PIN login isn't set up yet — ask a manager"
        : 'Could not verify PIN — check connection and try again';
      this.setState({submitting:false, err:msg, pin:'', shake:true});
      setTimeout(()=>this.setState({shake:false}),500);
    }
  }
  // Must go through CAApi.logout(), which clears the role AND BOTH worker-name
  // keys. Clearing only this page's two keys left 'caStationWorkerName' behind,
  // and since anyWorkerName() now accepts either key, station.html and
  // shipping.html would have admitted the just-logged-out worker with no PIN.
  logout(){ const a=window.CAApi; if(a&&a.logout) a.logout(); else { try{localStorage.removeItem('caShopRole');localStorage.removeItem('caShopWorkerName');localStorage.removeItem('caStationWorkerName');}catch(_){} } this.setState({screen:'pin',pin:'',role:null,name:'',err:''}); }

  renderVals(){
    const st=this.state;
    const dots=[0,1,2,3].map(i=>{ const f=i<st.pin.length; return { filled:f, bg:f?'#C6372B':'transparent', border:f?'#C6372B':'#3a3a40' }; });
    const keys=['1','2','3','4','5','6','7','8','9'];
    const pad=keys.map(k=>({ label:k, isText:true, isIcon:false, onPress:()=>this.press(k), bg:'#16161a', border:'#242428', color:'#ECEAE4' }));
    pad.push({ label:'', isText:false, isIcon:true, icon:'ti-backspace', onPress:()=>this.backspace(), bg:'transparent', border:'#242428', color:'var(--text-tertiary)' });
    pad.push({ label:'0', isText:true, isIcon:false, onPress:()=>this.press('0'), bg:'#16161a', border:'#242428', color:'#ECEAE4' });
    pad.push({ label:'', isText:false, isIcon:true, icon:'ti-arrow-right', onPress:()=>{ if(st.pin.length===4) this.submit(st.pin); }, bg:'#C6372B', border:'#C6372B', color:'#08080A' });

    // Three-tier role (2026-08-13): admin (Anthony) sees every dashboard
    // plus the Salesforce environment switcher; manager (Gian, Parker) sees
    // every dashboard but not the switcher; worker (everyone else) sees
    // every dashboard except Pre-Production Management. See
    // functions/api/_worker-auth.js for the server-side roster that decides
    // this and ca-api.js's isAdmin()/canAccessManagement() for where it's
    // enforced. This badge is just the label/color -- the actual gating
    // lives on the boards themselves.
    const ROLE_META = {
      admin:   { label:'Systems Operator', icon:'ti-settings',     color:'#C6372B', bg:'#2A100D', border:'#7A241C' },
      manager: { label:'Manager',          icon:'ti-shield-check', color:'#C9923A', bg:'#241a09', border:'#5E4214' },
      worker:  { label:'Worker',           icon:'ti-user-check',   color:'#7FA644', bg:'#18230D', border:'#3D5418' },
    };
    const roleMeta = ROLE_META[st.role] || ROLE_META.worker;
    const boards=[
      { label:'Pre-Production', sub:'Design · screens · receiving', href:'pre-production.html', color:'#C9923A', icon:'ti-clipboard-check' },
      { label:'Production Dashboard', sub:'Kanban · print → ship', href:'index.html', color:'#C6372B', icon:'ti-layout-kanban' },
      // Kept in sync by hand with NAV_BOARDS in ca-api.js -- this screen runs
      // BEFORE a role exists, so it can't use buildNavBoards(). See the comment
      // above NAV_BOARDS: this duplicate is deliberate, not an oversight.
      { label:'Production Calendar', sub:'Priority · press schedule · print dates', href:'calendar.html', color:'#9878C0', icon:'ti-calendar-time' },
      { label:'Station Board', sub:'Ink · screens · transfers', href:'station.html', color:'#5E9B9A', icon:'ti-device-tablet' },
      { label:'Shipping/Receiving', sub:'Post-production · ship · complete', href:'shipping.html', color:'#3E7CB1', icon:'ti-truck-delivery' },
      { label:'Stats', sub:'Prep-time buffer · team status · board totals', href:'stats.html', color:'#7FA644', icon:'ti-chart-bar' },
    ];
    const nm=st.name.trim();
    // Status line above the keypad: an error (red) wins if there is one,
    // otherwise "Verifying…" (neutral) while the round trip to
    // /api/worker-login is in flight, otherwise blank.
    const statusText = st.err || (st.submitting ? 'Verifying…' : '');
    const statusColor = st.err ? '#E8A89F' : 'var(--text-muted)';
    return {
      screenPin:st.screen==='pin', screenDone:st.screen==='done',
      dots, pad, statusText, statusColor, shakeAnim: st.shake?'ca-shake .45s':'none',
      name:st.name,
      nameInit:(nm[0]||'?').toUpperCase(),
      roleLabel:roleMeta.label, roleIcon:roleMeta.icon,
      roleColor:roleMeta.color, roleBg:roleMeta.bg, roleBorder:roleMeta.border,
      boards, onLogout:()=>this.logout(),
    };
  }
}
</script>
</body>
</html>
